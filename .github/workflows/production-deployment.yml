name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Immutable image digest (sha256:<64 lowercase hex characters>)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      IMAGE: ghcr.io/fbi-boy/universal-task-ai@${{ inputs.image_digest }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be sha256 followed by 64 lowercase hexadecimal characters." >&2
            exit 2
          fi
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_PATH}"
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy
        run: bash scripts/deploy-production.sh

      - name: Verify deployment
        run: |
          set -euo pipefail
          printf -v remote_status 'cd -- %q && docker compose -f docker-compose.prod.yml ps --status running' "$DEPLOY_PATH"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$remote_status"
