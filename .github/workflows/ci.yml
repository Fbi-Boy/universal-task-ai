name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Compile Python
        run: python -m compileall -q backend tests

  frontend-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated npm lockfile (temporary bootstrap)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f frontend/package-lock.json ] && ! git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "build(frontend): add generated npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Export generated npm lockfile for bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock-bootstrap
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Run browser smoke test
        run: npm run test:e2e
      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-smoke
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

