[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-task-ai"
version = "0.1.0"
description = "Security-first universal task orchestration core"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]
