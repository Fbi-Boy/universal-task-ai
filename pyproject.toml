[build-system]
requires = ["setuptools>=83,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-task-ai"
version = "0.1.0"
description = "Security-first universal task orchestration core"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: cross-component security boundary tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
