services:
  app:
    image: ${UTA_IMAGE:-universal-task-ai:local}
    build: .
    restart: unless-stopped
    read_only: true
    volumes:
      - run_state:/data
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    secrets:
      - universal_task_ai_api_key
      - brave_search_api_key

volumes:
  run_state:

secrets:
  universal_task_ai_api_key:
    file: ./secrets/universal_task_ai_api_key
  brave_search_api_key:
    file: ./secrets/brave_search_api_key
